# Local development services for Sastra.
# Postgres (app DB) + Mailpit (catches all outgoing SMTP so no real email is sent in dev).
#   Mailpit web UI: http://localhost:8025
services:
  postgres:
    # Same Postgres major as production, with the vector extension used by Wiki search.
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    container_name: sastra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ppp
      POSTGRES_PASSWORD: ppp
      POSTGRES_DB: sastra
    ports:
      - "5433:5432"
    volumes:
      - sastra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppp -d sastra"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: sastra-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # S3-compatible object storage for dev (mirrors Cloudflare R2).
  #   API: http://localhost:9000   Console: http://localhost:9001 (minio / minio12345)
  minio:
    image: minio/minio:latest
    container_name: sastra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sastra-minio:/data

  # One-shot: create the dev bucket, then exit.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb -p local/sastra-files;
      exit 0;
      "

volumes:
  sastra-pgdata:
  sastra-minio:
