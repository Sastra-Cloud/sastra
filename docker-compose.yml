# Local development services for Sastra.
# Postgres (app DB) + Mailpit (catches all outgoing SMTP so no real email is sent in dev).
#   Mailpit web UI: http://localhost:8025
services:
  postgres:
    # PostgreSQL 18.6 + pgvector 0.8.6, pinned for amd64 and arm64.
    # Existing PostgreSQL 17 users: follow docs/self-hosting/postgresql-upgrade.md.
    image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    container_name: sastra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sastra
      POSTGRES_PASSWORD: sastra
      POSTGRES_DB: sastra
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5433:5432"
    volumes:
      - sastra-pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sastra -d sastra"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: sastra-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # S3-compatible object storage for dev (mirrors Cloudflare R2).
  #   API: http://localhost:9000   Console: http://localhost:9001 (minio / minio12345)
  minio:
    image: minio/minio:latest
    container_name: sastra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sastra-minio:/data

  # One-shot: create the dev bucket, then exit.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb -p local/sastra-files;
      exit 0;
      "

volumes:
  sastra-pgdata18:
  sastra-minio:
