# Production Compose bundle for Sastra.
#
#   cp .env.example .env   # fill in the values
#   docker compose up -d
#
# Services: the app, Postgres with pgvector, a one-shot migrate step, a
# scheduler that calls the cron tick every minute, and (optional profile)
# MinIO for file storage when you have no S3-compatible bucket elsewhere.
# The app image is published at ghcr.io/sastra-cloud/sastra; pin a version tag.

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgres://sastra:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/sastra

services:
  postgres:
    # PostgreSQL 18.6 + pgvector 0.8.6, pinned for amd64 and arm64.
    # Upgrading from 17 requires a restore into pgdata18; see the upgrade guide.
    image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    restart: unless-stopped
    environment:
      POSTGRES_USER: sastra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sastra
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sastra -d sastra"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies migrations and the baseline workspace bootstrap, then exits.
  # Runs before the app so the app container can start without MIGRATE_ON_START.
  migrate:
    image: ghcr.io/sastra-cloud/sastra:${SASTRA_TAG:-0.2.0}
    <<: *app-env
    command: ["sh", "-c", "node scripts/migrate.mjs && node scripts/bootstrap-workspace.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/sastra-cloud/sastra:${SASTRA_TAG:-0.2.0}
    <<: *app-env
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sastra:${POSTGRES_PASSWORD}@postgres:5432/sastra
      MIGRATE_ON_START: "false"
    ports:
      - "${SASTRA_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Calls the cron tick once a minute; the app decides which jobs are due.
  scheduler:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        while true; do
          curl -fsS -m 300 -X POST http://app:3000/api/cron/tick \
            -H "Authorization: Bearer $$CRON_SECRET" >/dev/null || echo "tick failed";
          sleep 60;
        done

  # Optional: bundled S3-compatible storage. Start with `--profile minio` and
  # point R2_ENDPOINT at http://minio:9000 (see .env.example).
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [minio]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sastra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    volumes:
      - minio:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [minio]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-sastra} $${MINIO_ROOT_PASSWORD:-change-me-minio-password}; do sleep 1; done;
      mc mb -p local/$${R2_BUCKET:-sastra-files};
      exit 0;
      "
    env_file: .env

volumes:
  pgdata18:
  minio:
