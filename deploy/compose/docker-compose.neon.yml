# Sastra with a managed Postgres database, such as Neon.
# Download this file as docker-compose.yml and use the shared .env.example.
# Set DATABASE_URL to the pooled URL and DATABASE_MIGRATION_URL to the direct
# URL for the same database. No local Postgres container or volume is created.

x-app-env: &app-env
  env_file: .env
  environment: &database-env
    DATABASE_URL: ${DATABASE_URL:?set the pooled database URL in .env}
    DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?set the direct database URL in .env}

services:
  migrate:
    image: ghcr.io/sastra-cloud/sastra:${SASTRA_TAG:-latest}
    <<: *app-env
    command: ["sh", "-c", "node scripts/migrate.mjs && node scripts/bootstrap-workspace.mjs"]
    restart: "no"

  app:
    image: ghcr.io/sastra-cloud/sastra:${SASTRA_TAG:-latest}
    <<: *app-env
    restart: unless-stopped
    environment:
      <<: *database-env
      MIGRATE_ON_START: "false"
    ports:
      - "${SASTRA_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  scheduler:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    depends_on:
      app:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        while true; do
          curl -fsS -m 300 -X POST http://app:3000/api/cron/tick \
            -H "Authorization: Bearer $$CRON_SECRET" >/dev/null || echo "tick failed";
          sleep 60;
        done

  # Optional local file storage: docker compose --profile minio up -d.
  # See the Compose guide for browser access and the matching R2_* settings.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [minio]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sastra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    volumes:
      - minio:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [minio]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-sastra} $${MINIO_ROOT_PASSWORD}; do sleep 1; done;
      mc mb -p local/$${R2_BUCKET:-sastra-files};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sastra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
      R2_BUCKET: ${R2_BUCKET:-sastra-files}

volumes:
  minio:
