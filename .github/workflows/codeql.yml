name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"

permissions:
  # CodeQL reads workflow metadata when uploading results in private repositories.
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Personal private repositories do not support GitHub CodeQL code scanning.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
