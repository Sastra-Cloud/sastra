name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: sastra
          POSTGRES_PASSWORD: smoke-only
          POSTGRES_DB: sastra_container
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sastra -d sastra_container"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sastra:ci
          cache-from: type=gha,scope=container-smoke
          cache-to: type=gha,scope=container-smoke,mode=max
      - name: Start the production image as self-hosted and cloud instances
        env:
          DATABASE_URL: postgres://sastra:smoke-only@localhost:5432/sastra_container
          BETTER_AUTH_SECRET: container-smoke-secret-not-used-in-production
          BETTER_AUTH_URL: http://localhost:3000
        run: |
          start_and_check() {
            docker run -d --name sastra-smoke --network host \
              -e DATABASE_URL -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL "$@" sastra:ci
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://localhost:3000/api/ready > "$RUNNER_TEMP/ready.json"; then
                cat "$RUNNER_TEMP/ready.json"
                return 0
              fi
              sleep 2
            done
            docker logs sastra-smoke
            return 1
          }
          trap 'docker logs sastra-smoke; docker rm -f sastra-smoke' EXIT
          start_and_check
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/internal/management/status)" = 404
          docker rm -f sastra-smoke
          # Fly runs migration/bootstrap in a release machine, before the app.
          docker run --rm --network host -e DATABASE_URL --entrypoint sh sastra:ci \
            -c 'node scripts/migrate.mjs && node scripts/bootstrap-workspace.mjs'
          start_and_check -e MIGRATE_ON_START=false -e SASTRA_CLOUD_INSTANCE_ID=ci-smoke \
            -e SASTRA_CLOUD_MANAGEMENT_SECRET=smoke-management-secret
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/internal/management/status)" = 401
  postgres18:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: sastra
          POSTGRES_PASSWORD: smoke-only
          POSTGRES_DB: sastra_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sastra -d sastra_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate twice, preserve admin edits, and exercise HNSW search
        run: pnpm db:smoke
        env:
          DATABASE_URL: postgres://sastra:smoke-only@localhost:5432/sastra_smoke
          SASTRA_DISPOSABLE_DATABASE: "true"
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Non-blocking for now: the audit result still reaches the in-app
      # Security page below, but known advisories must not stop typecheck,
      # lint, tests, and build from running.
      - name: Production dependency audit
        id: production-audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      - name: Report production dependency audit to Sastra
        if: always() && github.event_name == 'push' && vars.SECURITY_STATUS_WEBHOOK_URL != ''
        env:
          STATUS_URL: ${{ vars.SECURITY_STATUS_WEBHOOK_URL }}
          STATUS_SECRET: ${{ secrets.SECURITY_STATUS_WEBHOOK_SECRET }}
          AUDIT_OUTCOME: ${{ steps.production-audit.outcome }}
        run: |
          if [ -z "$STATUS_URL" ] || [ -z "$STATUS_SECRET" ]; then
            echo "::error::Configure SECURITY_STATUS_WEBHOOK_URL and SECURITY_STATUS_WEBHOOK_SECRET."
            exit 1
          fi

          if [ "$AUDIT_OUTCOME" = "success" ]; then
            audit_status="passed"
          else
            audit_status="failed"
          fi

          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail-with-body --silent --show-error \
            -X POST "$STATUS_URL" \
            -H "Authorization: Bearer $STATUS_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"status\":\"$audit_status\",\"checkedAt\":\"$checked_at\"}"

      - name: Typecheck (tsrs)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Placeholders — all app pages are dynamic, so the build never hits the DB.
          # postgres.js connects lazily, so a dummy URL is fine for compilation.
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          BETTER_AUTH_URL: http://localhost:3243
